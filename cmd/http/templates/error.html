<!doctype html>
<html class="no-js" lang="">

<head>
    <meta charset="utf-8">
    <title>Error {{.Code}}</title>
    <meta name="description" content="{{.Message}}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta property="og:title" content="{{.Message}}">
    <meta property="og:type" content="website">

    <link rel="stylesheet" href="/static/css/main.min.css">

    <link rel="icon" type="image/svg+xml" href="/static/images/phispr.svg">
    <link rel="apple-touch-icon" href="/static/images/icon-192.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>

<body class="theme-gold">
    <main>
        <h1 class="error-message" style="text-align: center;">(╯°□°）╯︵ {{.Code}}</h1>
        <p style="text-align: center;" id="message">{{.Message}}</p>
        <p style="text-align: center; margin-top:2em;"><a href="/"><strong>( っ˶´ ˘ `)っ</strong> Home</a></p>
    </main>
</body>
<script>
    (function () {
        const container = document.getElementById("message");
        const text = container.innerText.trim();
        container.innerHTML = text.replace(/^room "([^"]+)" already exists$/, (match, word) => {
            return `room <a href="/rooms/${encodeURIComponent(word)}"><strong>${word}</strong></a> already exists`;
        });

        const body = document.querySelector("body");
        if (window.matchMedia('(display-mode: standalone)').matches) {
            body.classList.add("pwa")
        }
    }());
</script>

</html>
