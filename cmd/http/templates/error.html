<!doctype html>
<html class="no-js" lang="">

<head>
    <meta charset="utf-8">
    <title>Error {{.Code}}</title>
    <meta name="description" content="{{.Message}}">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta property="og:title" content="{{.Message}}">
    <meta property="og:type" content="website">

    <link rel="stylesheet" href="/static/css/normalize.css">
    <link rel="stylesheet" href="/static/css/main.css">

    <meta name="theme-color" content="#fafafa">
</head>

<body>
    <section class="main">
        <h1 class="error-message" style="text-align: center;">(╯°□°）╯︵ {{.Code}}</h1>
        <p style="text-align: center;" id="message">{{.Message}}</p>
        <p style="text-align: center; margin-top:2em;"><a href="/"><strong>( っ˶´ ˘ `)っ</strong> Home</a></p>
    </section>
</body>
<script>
    (function () {
        const container = document.getElementById("message");
        const text = container.innerText.trim();
        container.innerHTML = text.replace(/^room "([^"]+)" already exists$/, (match, word) => {
            return `room <a href="/rooms/${encodeURIComponent(word)}"><strong>${word}</strong></a> already exists`;
        });
    }());
</script>

</html>
