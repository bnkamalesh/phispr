<!doctype html>
<html class="no-js" lang="">

<head>
    <meta charset="utf-8">
    <title>Silly chat</title>
    <meta name="description" content="Silly public chat with chat rooms">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta property="og:title" content="Silly public chats">
    <meta property="og:type" content="website">

    <link rel="stylesheet" href="/static/css/normalize.css">
    <link rel="stylesheet" href="/static/css/main.css">

    <meta name="theme-color" content="#fafafa">
</head>

<body>
    <section class="main">
        <h1>Silly chat</h1>
        <section class="container small">
            <h3>Live rooms <span id="live-rooms-count">{{.LiveRooms}}/{{.TotalRooms}} (public: {{.PublicRooms}})</span>
            </h3>
            <ol id="public-chat-rooms">
                {{if not .Rooms}}
                <li style="list-style:none">No public chat rooms available</li>
                {{end}}

                {{range .Rooms}}
                <li class="room">
                    <a href="/rooms/{{.ID}}" class="room-link">
                        <span class="room-name">{{.Name}}</span>
                        <span class="room-members-count">({{len .Members}} / {{.Capacity}})</span>
                    </a>
                </li>
                {{end}}
            </ol>

            <h3>New room</h3>
            <section id="new-room">
                <form action="/rooms" method="POST">
                    <table>
                        <tr>
                            <td><label for="room-name">Name</label></td>
                            <td><input type="text" name="name" id="room-name" placeholder="cosmos" maxlength="512" />
                            </td>
                            <!-- <td>
                                <input type="checkbox" name="private" id="private" value="true" />
                                <label for="private">Private</label>
                            </td> -->
                        </tr>
                        <tr>
                            <td><label for="username">Username</label></td>
                            <td><input type="text" name="username" id="username" placeholder="maakri" maxlength="256" />
                            </td>
                        </tr>
                        <tr>
                            <td><input type="submit" value="Create & Join" /></td>
                        </tr>
                    </table>
                </form>
            </section>
        </section>
    </section>
</body>

</html>
