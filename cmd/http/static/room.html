<!doctype html>
<html class="no-js" lang="">

<head>
    <meta charset="utf-8">
    <title>Silly public chat {{.RoomID}}</title>
    <meta name="description" content="A silly public chat">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta property="og:title" content="Silly public chat">
    <meta property="og:type" content="website">

    <link rel="stylesheet" href="/static/css/normalize.css">
    <link rel="stylesheet" href="/static/css/main.css">

    <meta name="theme-color" content="#fafafa">
</head>

<body>
    <section class="main">
        <h1>
            <span id="room-name">
                {{.RoomID}}
            </span>
            <span class="members">({{.Live}} / {{.Capacity}})</span>

            <div class="sub-header">
                <span id="sse-status" title="establishing SSE for live messages"></span>
                {{if .Requestor}}
                <span class="author you">{{.Requestor}}</span>
                {{end}}
            </div>
        </h1>
        <div style="text-align: right; margin-bottom: 1em;">
            <button id="clear-messages">Clear Messages</button>

            {{if not .Requestor}}
            <form id="joinform" action="/rooms/{{.RoomID}}" method="POST">
                <table>
                    <tr>
                        <td><label for="username">Username</label></td>
                        <td><input type="text" name="username" id="username" placeholder="maakri" maxlength="256" />
                        </td>
                        <td><input type="submit" value="Join" /></td>
                    </tr>
                </table>
            </form>
            <div style="clear: both;"></div>
            {{end}}
        </div>
        <section id="messages">
            <ul id="messages-list">
                <li class="init" style="{{if .Messages}}display: none;{{end}}">No messages ...</li>
                {{range .Messages}}
                <li class="msg">
                    <!-- Golang template, access variable Requestor which is in the root -->
                    <span class="author {{if eq .Author.Name $.Requestor}}you{{end}}">{{.Author.Name}}</span>
                    <span class="datetime" data-datetime="{{.ServerReceivedAt}}"></span>
                    <p>{{.Content}}</p>
                </li>
                {{end}}
            </ul>
        </section>

        <section style="{{if not .Requestor }}display: none;{{end}}">
            <form id="message-form" action="/rooms/{{.RoomID}}/messages" method="POST">
                <textarea name="message" id="message" placeholder="Type your message here..."
                    maxlength="2048"></textarea>
                <button type="submit">Send</button>
            </form>
        </section>
        <footer>
            <a href="/">Home</a>
        </footer>
    </section>
    <script src="/static/js/room.js"></script>
</body>

</html>
